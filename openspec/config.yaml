schema: spec-driven

context: |
  Project: Nodra
  Stack: pnpm workspace with React, Vite/PWA, TypeScript, Vitest, ESLint, and Playwright (Chromium).
  Architecture: Web composition in apps/web over independent domain, geometry, validation, editor-core, renderer-svg, UI, and persistence packages.
  Testing: Vitest unit tests, strict TypeScript typechecking, ESLint, root build, and one Chromium Playwright smoke test with an automatically started Vite server.
  Strict TDD: disabled by repository policy; tests remain required regression evidence for behavior changes.
  Artifact store: OpenSpec files in this repository.

strict_tdd: false

testing:
  test_runner:
    available: true
    command: "corepack pnpm test"
    framework: "Vitest"
  layers:
    unit: true
    integration: false
    e2e: true
  coverage:
    available: false
    command: ""
  quality:
    linter:
      available: true
      command: "corepack pnpm lint"
    type_checker:
      available: true
      command: "corepack pnpm typecheck"
    formatter:
      available: false
      command: ""

rules:
  proposal:
    - Include a rollback plan for risky changes.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
  design:
    - Document architecture decisions with rationale.
    - Include sequence diagrams for complex flows.
  tasks:
    - Group tasks by phase with hierarchical numbering.
    - Keep tasks completable in one session.
  apply:
    guidelines:
      - Follow conventions established after the stack is detected.
    tdd: false
    test_command: "corepack pnpm test"
  verify:
    test_command: "corepack pnpm test"
    build_command: "corepack pnpm build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
